; Two targets over one source tree. build_src_filter picks which main() gets
; compiled, so the flood firmware and the ultrasonic probe never need files to
; be renamed or moved aside -- both stay in git, and switching is one flag.
;
;   pio run -t upload              firmware banjir (default)
;   pio run -e probe -t upload     probe ultrasonik saja
;
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32dev]
build_src_filter = +<*> -<probe_ultra.cpp>
lib_deps =
    adafruit/RTClib@^2.1.4

; No lib_deps on purpose. The probe needs nothing but the Arduino core, and
; RTClib drags in Adafruit BusIO, which fails to resolve SPI.h in a source tree
; that never includes it. Keeping the probe dependency-free is also what makes
; it a clean test: nothing else can stall the loop between pings.
[env:probe]
build_src_filter = +<probe_ultra.cpp>
